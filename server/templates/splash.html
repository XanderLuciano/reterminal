<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 800px; height: 480px;
    background: #ffffff;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #222222;
  }
  .logo { margin-bottom: 16px; }
  .logo svg { display: block; }
  h1 { font-size: 52px; font-weight: 700; margin: 0; }
  .sub { font-size: 26px; color: #666666; margin-top: 16px; }
</style></head><body>
  <div class="logo"><svg width="96" height="80" viewBox="0 0 72 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="2" width="68" height="42" rx="4" stroke="#222" stroke-width="2.5" fill="#f5f5f5"/>
    <rect x="10" y="8" width="52" height="30" rx="2" fill="#222"/>
    <polygon points="36,42 44,56 28,56" fill="#ddd" stroke="#222" stroke-width="2"/>
    <rect x="22" y="48" width="28" height="4" rx="2" fill="#222"/>
  </svg></div>
  <h1>{{ device }} Dashboard</h1>
  <div class="sub">Booting...</div>
</body></html>
