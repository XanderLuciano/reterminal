<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; height: 480px; font-family: system-ui, sans-serif; background: #fff; color: #000; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 50px 60px; text-align: center; }
h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; }
.subtitle { font-size: 15px; color: #333; margin-bottom: 28px; max-width: 500px; line-height: 1.5; }
.box { border: 3px solid #000; padding: 28px 40px; margin-bottom: 20px; max-width: 500px; }
.steps { font-size: 14px; line-height: 2.2; text-align: left; }
.steps .n { display: inline-block; width: 26px; height: 26px; background: #000; color: #fff; border-radius: 50%; text-align: center; line-height: 26px; font-size: 13px; font-weight: 700; margin-right: 12px; }
.url { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 600; }
.footer { font-size: 11px; color: #666; margin-top: 10px; }
</style></head>
<body>
  <h1>Setup Required</h1>
  <p class="subtitle">This display needs to be configured before it can show your screens.</p>
  <div class="box">
    <div class="steps">
      <p><span class="n">1</span> Open the dashboard on your computer</p>
      <p><span class="n">2</span> Go to <strong>Devices</strong> to find this display</p>
      <p><span class="n">3</span> Assign screens to this device</p>
    </div>
  </div>
  <p class="footer">Press any button to try connecting now</p>
</body>
</html>
