<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 800px; height: 480px;
    background: #ffffff;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #222222;
  }
  .icon { margin-bottom: 20px; }
  .icon svg { display: block; }
  h1 { font-size: 42px; font-weight: 700; margin: 0 0 12px 0; }
  .msg { font-size: 28px; color: #333333; margin-bottom: 6px; }
  .hint { font-size: 22px; color: #777777; margin-top: 28px; }
</style></head><body>
  <div class="icon"><svg width="80" height="70" viewBox="0 0 64 56" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="32,2 62,52 2,52" fill="#222" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
    <rect x="29" y="20" width="6" height="16" rx="3" fill="#fff"/>
    <circle cx="32" cy="44" r="4" fill="#fff"/>
  </svg></div>
  <h1>Connection Error</h1>
  <div class="msg">{{ message }}</div>
  <div class="hint">Check WiFi or server · Press any button to retry</div>
</body></html>
