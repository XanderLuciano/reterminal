<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 800px; height: 480px;
    background: #ffffff;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #222222;
  }
  .icon { margin-bottom: 16px; }
  .icon svg { display: block; }
  h1 { font-size: 38px; font-weight: 700; margin: 0 0 8px 0; }
  .msg { font-size: 26px; color: #333333; margin-bottom: 4px; }
  .hint { font-size: 20px; color: #777777; margin-top: 16px; }
  .error-code { font-size: 18px; color: #999999; margin-top: 8px; }
</style></head><body>
  <div class="icon"><svg width="70" height="60" viewBox="0 0 64 56" fill="none" xmlns="http://www.w3.org/2000/svg">
    {% if "WiFi" in message or "wifi" in message %}
    <circle cx="32" cy="32" r="22" fill="none" stroke="#222" stroke-width="3"/>
    <line x1="32" y1="24" x2="32" y2="34" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="42" r="3" fill="#222"/>
    <line x1="14" y1="14" x2="50" y2="50" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    {% else %}
    <polygon points="32,2 62,52 2,52" fill="#222" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
    <rect x="29" y="20" width="6" height="16" rx="3" fill="#fff"/>
    <circle cx="32" cy="44" r="4" fill="#fff"/>
    {% endif %}
  </svg></div>
  <h1>{{ header }}</h1>
  <div class="msg">{{ message }}</div>
  <div class="error-code">{{ code }}</div>
  <div class="hint">Press any button to retry</div>
</body></html>
