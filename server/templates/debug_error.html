<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 800px; height: 480px;
  font-family: 'Courier New', 'Consolas', monospace;
  background: #fff; color: #000;
  padding: 16px 24px;
  overflow: hidden;
}
.header {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 3px solid #000;
  padding-bottom: 6px;
  margin-bottom: 10px;
}
.header .title { font-size: 22px; font-weight: 800; }
.header .code { font-size: 14px; background: #000; color: #fff; padding: 2px 10px; }
.row { display: flex; margin-bottom: 3px; }
.label { width: 130px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.value { font-size: 11px; word-break: break-all; flex: 1; }
.section { margin-top: 8px; border-top: 1px solid #999; padding-top: 6px; }
.section-title { font-size: 12px; font-weight: 800; margin-bottom: 3px; }
.body-preview { 
  font-size: 10px; line-height: 1.4; 
  max-height: 140px; overflow: hidden;
  background: #f5f5f5; padding: 6px 8px;
  border: 1px solid #ccc;
  white-space: pre-wrap; word-break: break-all;
}
.bottom-bar {
  margin-top: 6px; font-size: 11px; color: #888; text-align: center;
}
</style></head><body>
<div class="header">
  <span class="title">⚠ Server Error</span>
  <span class="code">HTTP {{ status_code }}</span>
</div>

<div class="row"><span class="label">URL</span><span class="value">{{ url }}</span></div>
<div class="row"><span class="label">Device ID</span><span class="value">{{ device_id }}</span></div>
<div class="row"><span class="label">Page</span><span class="value">{{ page }}</span></div>
<div class="row"><span class="label">Timestamp</span><span class="value">{{ timestamp }}</span></div>
{% if error_type %}
<div class="row"><span class="label">Error Type</span><span class="value">{{ error_type }}</span></div>
{% endif %}
{% if exception %}
<div class="row"><span class="label">Exception</span><span class="value" style="color:#c00;">{{ exception }}</span></div>
{% endif %}

<div class="section">
  <div class="section-title">Response Body</div>
  <div class="body-preview">{{ body_preview }}</div>
</div>

<div class="bottom-bar">Press any button to retry</div>
</body></html>
