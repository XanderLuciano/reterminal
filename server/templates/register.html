<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; height: 480px; font-family: system-ui, sans-serif; background: #fff; color: #111; overflow: hidden; display: flex; }
.left { flex: 1; padding: 32px; display: flex; flex-direction: column; justify-content: center; }
.right { width: 280px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 24px; }
h1 { font-size: 22px; margin-bottom: 8px; }
.id-box { font-family: monospace; font-size: 28px; font-weight: 700; letter-spacing: 2px; background: #111; color: #fff; padding: 8px 16px; border-radius: 6px; display: inline-block; margin: 12px 0; }
.steps { margin-top: 16px; font-size: 13px; line-height: 1.6; }
.steps .n { display: inline-block; width: 20px; height: 20px; background: #111; color: #fff; border-radius: 50%; text-align: center; line-height: 20px; font-size: 11px; margin-right: 8px; }
.url { font-family: monospace; font-size: 12px; color: #333; margin-top: 4px; }
.qr-label { font-size: 11px; color: #666; margin-top: 8px; text-align: center; }
</style></head>
<body>
<div class="left">
  <h1>🔐 Device Not Registered</h1>
  <p style="font-size:14px;color:#555;margin-bottom:4px;">Your display needs to be registered before it can show custom screens.</p>
  <div class="id-box">{{ device_id }}</div>
  <div class="steps">
    <p><span class="n">1</span> Open <span class="url">{{ register_url }}</span></p>
    <p><span class="n">2</span> Enter the device ID shown above</p>
    <p><span class="n">3</span> Assign screens to your display</p>
    <p style="margin-top:12px;color:#888;font-size:11px;">Or scan the QR code →</p>
  </div>
</div>
<div class="right">
  <img src="data:image/png;base64,{{ qr_b64 }}" width="200" height="200" style="image-rendering:pixelated;">
  <p class="qr-label">Scan to register this device</p>
</div>
</body>
</html>
