<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; height: 480px; font-family: system-ui, sans-serif; background: #fff; color: #000; overflow: hidden; display: flex; }
.left { flex: 1; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
.right { width: 280px; background: #fff; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 24px; border-left: 2px solid #ddd; }
h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
.subtitle { font-size: 14px; color: #000; margin-bottom: 16px; }
.id-box { font-family: 'Courier New', monospace; font-size: 30px; font-weight: 800; letter-spacing: 3px; background: #000; color: #fff; padding: 10px 20px; border: 2px solid #000; display: inline-block; margin: 8px 0 20px; }
.steps { font-size: 13px; line-height: 2.0; }
.steps .n { display: inline-block; width: 22px; height: 22px; background: #000; color: #fff; border-radius: 50%; text-align: center; line-height: 22px; font-size: 12px; font-weight: 700; margin-right: 10px; }
.steps .url { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 600; }
.hint { margin-top: 20px; font-size: 12px; font-weight: 700; }
.qr-label { font-size: 12px; font-weight: 700; margin-top: 10px; text-align: center; }
</style></head>
<body>
<div class="left">
  <h1>Device Not Registered</h1>
  <p class="subtitle">Your display needs to be registered before it can show custom screens.</p>
  <div class="id-box">{{ device_id }}</div>
  <div class="steps">
    <p><span class="n">1</span> Go to <span class="url">{{ register_url }}</span></p>
    <p><span class="n">2</span> Enter the device ID shown above</p>
    <p><span class="n">3</span> Assign screens to this display</p>
  </div>
  <p class="hint">Or scan the QR code --&gt;</p>
</div>
<div class="right">
  <img src="data:image/png;base64,{{ qr_b64 }}" width="210" height="210" style="image-rendering:pixelated;">
  <p class="qr-label">Scan to register</p>
</div>
</body>
</html>
