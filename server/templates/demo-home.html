<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; height: 480px; font-family: system-ui, sans-serif; background: #1a1a2e; color: #eaeaea; overflow: hidden; }
.header { background: linear-gradient(135deg, #e94560, #0f3460); padding: 16px 24px; }
.header h1 { font-size: 20px; }
.header span { font-size: 12px; opacity: .7; }
.cards { display: flex; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }
.card { flex: 1; min-width: 160px; background: #16213e; border-radius: 8px; padding: 16px; text-align: center; }
.card .icon { font-size: 28px; margin-bottom: 8px; }
.card .value { font-size: 28px; font-weight: 700; color: #4ecca3; }
.card .label { font-size: 11px; color: #aabbcc; margin-top: 4px; }
.alert { margin: 0 24px; padding: 12px 16px; background: rgba(233,69,96,.15); border-left: 3px solid #e94560; border-radius: 4px; font-size: 13px; }
.alert strong { color: #e94560; }
.footer { position: absolute; bottom: 0; width: 100%; padding: 8px 24px; font-size: 10px; color: #555; text-align: right; }
</style></head>
<body>
<div class="header">
  <h1>🏠 Home Dashboard</h1>
  <span>Living Room Display</span>
</div>
<div class="cards">
  <div class="card">
    <div class="icon">🌡️</div>
    <div class="value">72°</div>
    <div class="label">Indoor Temp</div>
  </div>
  <div class="card">
    <div class="icon">💡</div>
    <div class="value">4</div>
    <div class="label">Lights On</div>
  </div>
  <div class="card">
    <div class="icon">🔒</div>
    <div class="value">Locked</div>
    <div class="label">Front Door</div>
  </div>
  <div class="card">
    <div class="icon">🔋</div>
    <div class="value">87%</div>
    <div class="label">Display Battery</div>
  </div>
</div>
<div class="alert"><strong>⚠ Garage:</strong> Door open for 2 hours</div>
<div class="footer">Updated just now · Glitch 👾</div>
</body>
</html>
