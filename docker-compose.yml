# reTerminal ePaper Dashboard — Docker Compose
#
# Quick start:
#   docker compose up -d
#   → http://localhost:8088  (dashboard)
#   → http://localhost:8088/flasher  (web flasher UI)
#
# The web flasher uses Web Serial API — connect your ESP32-S3 via USB,
# then open the flasher page in a browser that supports Web Serial (Chrome/Edge).
# USB passthrough to the container is NOT needed — the browser handles it.

services:
  epaper-server:
    build: .
    container_name: reterminal-server
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      # Mount the server directory for live config/hot-reload (optional)
      - ./server:/app/server
      - ./flasher:/app/flasher
      # Persist build artifacts across restarts
      - ./flasher/builds:/app/flasher/builds
      # Persist URL page screenshots and caches
      - ./server/url_pages_data:/app/server/url_pages_data
      # Persist weather cache
      - ./server/weather_cache.json:/app/server/weather_cache.json
    environment:
      - FLASK_ENV=production
      # Uncomment to change the port:
      # - EPAPER_PORT=8088
    # Network mode is default (bridge) — Web Serial works client-side
    # No device passthrough or privileged mode needed
