# reTerminal ePaper Dashboard — Docker Compose
#
# Quick start:
#   docker compose up -d
#   → http://localhost:3000  (Nuxt web UI — flasher, devices, screens)
#   → http://localhost:8088  (Flask API — dashboard rendering, builds)
#
# The web flasher uses Web Serial API — connect your ESP32-S3 via USB,
# then open the flasher page in a browser that supports Web Serial (Chrome/Edge).
# USB passthrough to the container is NOT needed — the browser handles it.

services:
  epaper:
    build: .
    container_name: reterminal
    restart: unless-stopped
    ports:
      - "8088:8088"   # Flask — dashboard rendering, builds, page API
      - "3000:3000"   # Nuxt — web UI, devices/screens management API
    volumes:
      - ./server:/app/server
      - ./flasher:/app/flasher
      - ./flasher/builds:/app/flasher/builds
      - ./server/url_pages_data:/app/server/url_pages_data
      - ./server/weather_cache.json:/app/server/weather_cache.json
      - epaper-data:/app/web/.data   # SQLite persistence
    environment:
      - FLASK_ENV=production

volumes:
  epaper-data:
